<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Paint the ground before React mounts, so there is never a white flash
         ahead of the ignition sequence.

         Scoped to <html> and keyed off data-theme on purpose. This block is
         unlayered, and unlayered rules beat everything in @layer base
         regardless of specificity — so declaring `body { background }` here
         would permanently override the themed `bg-void` and pin the page dark
         while child text still flipped to its light values. Leave body to
         Tailwind; only the root canvas is pre-painted. -->
    <style>
      html {
        background: #050814;
      }
      html[data-theme='light'] {
        background: #f5f6fb;
      }
      body {
        margin: 0;
      }
    </style>

    <!-- Resolve the theme before first paint. Render-blocking on purpose and
         kept inline: a deferred module would let React mount against the
         default theme first and flash the wrong ground on toggle-back. -->
    <script>
      ;(function () {
        var t = 'dark'
        try {
          var saved = localStorage.getItem('g10x-theme')
          // Only an explicit choice wins. Absent one the site stays dark —
          // it is the brand default and the ground the artwork is built for,
          // so prefers-color-scheme is deliberately not consulted here.
          if (saved === 'light' || saved === 'dark') t = saved
        } catch (e) {
          /* Safari private mode throws on localStorage; dark is the fallback. */
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>

    <!-- Title, description, canonical, Open Graph, Twitter and geo tags are
         injected here at build time by the `g10x-head-meta` plugin in
         vite.config.js, sourced from src/content/site.js. They are deliberately
         not written by hand: social scrapers do not run JS, so they have to be
         in the served payload, and duplicating them here would emit each tag
         twice. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
